engine:
  channel: "staging"
  releases: "missingbulb/ClaudiniteStagingDistro"
  version: "1.61020.7"
  manifest: "sha512-CqJqOwKChEX63GRO3uFh90hs6E9dmU40a60FCtAXytfdG8L18nM/wTnHieSZNaWIrmrTUkBHpjfd/KJy/bk6gg=="
packs:
  channel: "canary"
  declared:
    - id: "nor-finder"
      source: "local"
    - "basics"
    - "claudinite-lifecycle"
    - "git-github"
    - id: "claude-code-web-users-support"
      answers:
        store: "missingbulb/Shepherd"
      config:
        repo: "missingbulb/Shepherd"
    - "claudinite-growth"
    - "research-project"
    - id: "github-pages"
      answers:
        publish_set: "Ariel asked for the NoR Finder page to be served from GitHub Pages with no backend (2026-09-28). The page is web/ and runs the Python in detection/ and src/ as it sits in the repo, with a root index.html that forwards to web/: publish_root ., publish_paths index.html web detection src, build_command python3 web/build.py (fetches the tifffile wheel into web/vendor/)."
    - "public-website"
    - "html"
    - "numpy-image-processing"
    - "node"
  sources:
    - "missingbulb/Shepherd"
  manager:
    repo: "missingbulb/Shepherd"
tasks:
  routines:
    default:
      url: "https://api.anthropic.com/v1/claude_code/routines/trig_015wS2eGf4nRRnk6q47jTuQn/fire"
      tokenSecret: "CCR_ROUTINE_TOKEN"
  merge:
    "engine/update": "merge-safe-changes"
  frequency:
    "engine/update": "weekly"
