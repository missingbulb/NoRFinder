engine:
  channel: "staging"
  version: "1.61105.1"
  manifest: "sha512-pI0wPndndDMZmhR0SDMcDdXAQkR6wKUJjGrB+3EcaXa2vwzmh8jTEGCGDBvVr9q/Fd88L/x2CVszZ2LAZbvw+Q=="
packs:
  channel: "canary"
  declared:
    - id: "nor-finder"
      source: "local"
    - "basics"
    - "claudinite-lifecycle"
    - "git-github"
    - id: "claude-code-web-users-support"
      answers:
        store: "missingbulb/Shepherd"
      config:
        repo: "missingbulb/Shepherd"
    - "claudinite-growth"
    - "research-project"
    - "cloudflare-site"
    - "public-website"
    - "html"
    - "numpy-image-processing"
    - id: "product-wiki"
      answers:
        product: "Platform of studies: rauntruth.com, an in-browser, no-upload page that turns fluorescence-microscopy images into checked numbers and collects researchers' ground truth; each study (NoR Finder first) is one analysis on it."
        users: "Neuroscience and cell-biology researchers who quantify structures in fluorescence-microscopy images (first: labs counting and measuring Nodes of Ranvier in myelin injury), and want numbers they can review and correct, without installing software or uploading images."
        market: "Microscopy image analysis. Desktop tools: Fiji/ImageJ, napari, QuPath, CellProfiler, ilastik; commercial: Imaris, arivis, Huygens; learned segmenters: Cellpose, StarDist; manual counting in ImageJ as the incumbent for node counting; plus web viewers and platforms (OMERO, Viv/Avivator, vizarr) as the browser-side alternatives."
    - id: "nor-study"
      source: "local"
    - id: "vascular-study"
      source: "local"
  sources:
    - "missingbulb/Shepherd"
  manager:
    repo: "missingbulb/Shepherd"
tasks:
  routines:
    default:
      url: "https://api.anthropic.com/v1/claude_code/routines/trig_015wS2eGf4nRRnk6q47jTuQn/fire"
      tokenSecret: "CCR_ROUTINE_TOKEN"
  merge:
    "engine/update": "merge-safe-changes"
  frequency:
    "engine/update": "weekly"
growth:
  sessionHistory: "localEncrypted"
checks:
  accept:
    - rule: no-scheduled-fleet-executor
      path: .github/workflows/tests-full.yml
      reason: "the owner chose this workflow's own nightly schedule; the canon retires the check (Claudinite/PublicPacks#182)"
