name: Tests
on:
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Python packages
        run: python3 -m pip install -r requirements.txt
      - name: Fetch the ground-truth images
        run: python3 detection/ground_truth.py fetch
      - name: Run the fast tests
        run: python3 -m pytest tests -q -m "not full" --durations=5
