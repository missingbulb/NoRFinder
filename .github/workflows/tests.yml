name: Tests
on:
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.11'
      - name: Restore the Python packages
        id: venv
        uses: actions/cache@v4
        with:
          path: ~/venv
          key: venv-${{ runner.os }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('requirements.txt') }}
      - name: Install Python packages
        if: steps.venv.outputs.cache-hit != 'true'
        run: python3 -m venv ~/venv && ~/venv/bin/pip install -r requirements.txt
      - run: echo ~/venv/bin >> "$GITHUB_PATH"
      - name: Restore the ground-truth images
        uses: actions/cache@v4
        with:
          path: data/raw
          key: images-${{ hashFiles('data/sources.json', 'detection/lab/ground_truth/dataset.json') }}
      - name: Fetch the ground-truth images not restored
        run: python3 detection/ground_truth.py fetch
      - name: Run the fast tests
        run: python3 -m pytest tests -q -m "not full" --durations=5
