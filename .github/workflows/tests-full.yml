name: Full tests
on:
  push:
    branches: [main]
  pull_request:
    paths: ['.github/workflows/tests-full.yml']
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Restore the Python packages
        id: venv
        uses: actions/cache@v5
        with:
          path: ~/venv
          key: venv-${{ runner.os }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('requirements.txt') }}
      - name: Install Python packages
        if: steps.venv.outputs.cache-hit != 'true'
        run: python3 -m venv ~/venv && ~/venv/bin/pip install -r requirements.txt
      - run: echo ~/venv/bin >> "$GITHUB_PATH"
      - name: Restore Pyodide and Chromium
        id: browser
        uses: actions/cache@v5
        with:
          path: |
            detection/browser/node_modules
            ~/.cache/ms-playwright
          key: browser-${{ runner.os }}-pyodide-314.0.7-playwright-1.56.1
      - name: Install Pyodide and Chromium for the page tests
        run: |
          npm i -g playwright@1.56.1
          if [ "${{ steps.browser.outputs.cache-hit }}" != 'true' ]; then
            npm i --prefix detection/browser pyodide@314.0.7
            playwright install chromium
          fi
      - name: Restore the ground-truth images
        uses: actions/cache@v5
        with:
          path: data/raw
          key: images-${{ hashFiles('data/sources.json', 'detection/lab/ground_truth/dataset.json') }}
      - name: Fetch the ground-truth images not restored
        run: python3 detection/ground_truth.py fetch
      - name: Run every test
        run: python3 -m pytest tests -q --durations=10

  # Main is released only once the full set is green on it; the release task owns the deploy.
  release:
    needs: tests
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Wake the site release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run claudinite-scheduler.yml -R "$GITHUB_REPOSITORY" -f wake=github-pages/site-release
