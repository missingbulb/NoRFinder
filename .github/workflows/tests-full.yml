name: Full tests
on:
  push:
    branches: [main]
  pull_request:
    paths: ['.github/workflows/tests-full.yml']
  # nightly, best-effort: GitHub may fire it late or drop a night; a failed night mails whoever last changed this line
  schedule:
    - cron: '22 3 * * *'
  workflow_dispatch:
# the Playwright the page tests drive the browsers with; its Chromium must have what the page uses, interest invokers among them
env:
  PLAYWRIGHT: 1.63.0
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Restore the Python packages
        id: venv
        uses: actions/cache@v5
        with:
          path: ~/venv
          key: venv-${{ runner.os }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('requirements.txt') }}
      - name: Install Python packages
        if: steps.venv.outputs.cache-hit != 'true'
        run: python3 -m venv ~/venv && ~/venv/bin/pip install -r requirements.txt
      - run: echo ~/venv/bin >> "$GITHUB_PATH"
      - name: Restore Pyodide and Chromium
        id: browser
        uses: actions/cache@v5
        with:
          path: |
            web-tests/node_modules
            ~/.cache/ms-playwright
          key: browser-${{ runner.os }}-pyodide-314.0.7-playwright-${{ env.PLAYWRIGHT }}
      - name: Install Pyodide and Chromium for the page tests
        run: |
          npm i -g "playwright@$PLAYWRIGHT"
          if [ "${{ steps.browser.outputs.cache-hit }}" != 'true' ]; then
            npm i --prefix web-tests pyodide@314.0.7
            playwright install chromium
          fi
      - name: Run every test
        run: python3 -m pytest web-tests studies dev/tools/trick_pool -q -n auto --durations=10

  # Main is released only once the full set is green on it; the release task owns the deploy.
      # Claudinite's checks; the engine update keeps these steps current.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/claudinite
            ~/.npm/_cacache
          key: cn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.claudinite/settings.yaml') }}
          restore-keys: cn-${{ runner.os }}-${{ runner.arch }}-
      - name: install the engine settings.yaml pins
        run: npx --yes --prefer-offline @claudinite/setup@1.0.1
      - name: name the Claudinite checks build
        id: claudinite-checks
        continue-on-error: true
        run: .claudinite/bin/cn check key >> "$GITHUB_OUTPUT"
      - if: steps.claudinite-checks.outputs.key != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.claudinite-checks.outputs.dir }}
          key: claudinite-checks-${{ runner.os }}-${{ runner.arch }}-${{ steps.claudinite-checks.outputs.key }}
      - name: cn check work-and-world
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .claudinite/bin/cn check work-and-world
  # The full set on Firefox and WebKit, nightly or by hand only; it gates no release, and other_engines.py says
  # when an engine's failures fail the night (req/checks/other-engines).
  other-engines:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [firefox, webkit]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Restore the Python packages
        id: venv
        uses: actions/cache@v5
        with:
          path: ~/venv
          key: venv-${{ runner.os }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('requirements.txt') }}
      - name: Install Python packages
        if: steps.venv.outputs.cache-hit != 'true'
        run: python3 -m venv ~/venv && ~/venv/bin/pip install -r requirements.txt
      - run: echo ~/venv/bin >> "$GITHUB_PATH"
      - name: Install Pyodide and the engine with its system libraries
        run: |
          npm i -g "playwright@$PLAYWRIGHT"
          npm i --prefix web-tests pyodide@314.0.7
          playwright install --with-deps ${{ matrix.engine }}
      # Mesa's software EGL, which the page tests launch Firefox on for its WebGL (web-tests/engine.mjs)
      - name: Install Mesa's software GL
        if: matrix.engine == 'firefox'
        run: sudo apt-get install -y --no-install-recommends libegl1 libegl-mesa0 libgl1-mesa-dri
      - name: Run the full set on ${{ matrix.engine }}
        run: python3 dev/tools/build/other_engines.py ${{ matrix.engine }}

  release:
    needs: tests
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Wake the site release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run claudinite-scheduler.yml -R "$GITHUB_REPOSITORY" -f wake=cloudflare-site/site-release
