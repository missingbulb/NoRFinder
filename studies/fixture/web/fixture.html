<template data-slot="processing">
  <div id="fx-box">
    <input type="range" id="fx-threshold" min="0" max="255" value="128">
    <button id="fx-count" class="primary" disabled>Count</button>
  </div>
</template>
<template data-slot="tasks">
  <div id="fx-result" class="dim">Nothing counted yet.</div>
  <p class="hint unpublished" id="fx-counted">The count's postprocessing, gone once the study is published.</p>
  <label id="fx-check" hidden><input type="checkbox" id="fx-done"> The count is right</label>
</template>
<template data-slot="summary">
  <div id="fx-sum" class="dim">Nothing counted yet.</div>
</template>
<template data-slot="views">
  <div id="items-view" hidden>
    <div class="card" id="fx-item"></div>
  </div>
</template>
