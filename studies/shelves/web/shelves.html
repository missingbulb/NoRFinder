<template data-slot="processing">
  <div id="bs-box">
    <label class="bs-row">Reader
      <select id="bs-reader"></select>
    </label>
    <div class="bs-row">
      <button id="bs-find" class="primary" disabled>Find books</button>
      <button id="bs-read" disabled>Read titles</button>
    </div>
    <p id="bs-found" class="dim">Nothing found yet.</p>
  </div>
</template>
<template data-slot="tasks">
  <div id="bs-tasks"></div>
</template>
<template data-slot="summary">
  <div id="bs-titles">
    <ol id="bs-list" class="bs-list"></ol>
    <button id="bs-export" disabled>Download for the matcher</button>
  </div>
</template>
<template data-slot="over-image">
  <p id="bs-draw-hint" class="bs-hint" hidden>Click the book's four corners. Esc stops.</p>
  <div id="bs-menu" class="bs-menu" role="menu" hidden>
    <button type="button" role="menuitem" data-do="add">Add a book here</button>
    <button type="button" role="menuitem" data-do="flip">Flip upside down</button>
    <button type="button" role="menuitem" data-do="delete">Delete this book</button>
  </div>
</template>
