<template data-slot="processing">
    <div id="model-set">
      <select id="vm-algo" disabled aria-label="Extraction algorithm"></select>
      <details id="vm-about" class="fold">
        <summary>How the algorithm works</summary>
        <div id="vm-about-note" class="hint"></div>
      </details>
      <div class="row">
        <button type="button" id="vm-run" class="primary" disabled>Execute</button>
      </div>
      <div id="model-on" class="col" hidden>
        <div class="views" id="vm-edits">
          <button type="button" id="m-undo">Undo</button>
          <button type="button" id="m-redo">Redo</button>
          <button type="button" id="m-reset">Discard edits</button>
        </div>
      </div>
      <p class="note" id="model-msg"></p>
    </div>
</template>
<template data-slot="summary">
    <p class="note" id="model-facts">No vessel model yet: Execute the algorithm.</p>
    <div id="vm-marks" class="col" hidden>
      <div class="views"><button type="button" id="m-lasso" aria-pressed="false">Mark a damaged area</button></div>
      <p class="note" id="lasso-note"></p>
    </div>
</template>
<template data-slot="tasks">
    <div id="vm-tasks" hidden>
      <span id="task-tools"><details class="menu" id="task-menu"><summary title="This junction's options" aria-label="This junction's options"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></g></svg></summary><div class="pop" id="task-opts"></div></details><button id="task-skip" class="link" type="button" title="The next area, leaving this one for later">Skip ›</button></span>
      <div id="task-now">
        <div class="area-head"><span id="area-name"></span><select id="area-grid" aria-label="How many areas" title="How many areas the field is cut into: a bigger area is judged whole"></select></div>
        <div id="area-map" role="group" aria-label="The areas: pick one"></div>
        <div id="step-lines" class="step"><p class="hint">Drag a point to move its line across the picture; right-click a line or a point to delete, bend or connect. A faint line is low-confidence: click it to keep it, or it is declined.</p>
          <button id="lines-ok" class="primary" type="button">Lines are right</button></div>
        <div id="step-missed" class="step"><p class="hint">Draw any vessel the algorithm missed in this area.</p>
          <button type="button" id="m-draw" aria-pressed="false">Draw a missed vessel</button><p class="note" id="draw-note"></p>
          <button id="area-ok" class="primary" type="button">No missed vessels here</button></div>
        <div id="step-junctions" class="step"><p class="hint">Turn the area to see each junction in depth: a real junction, or vessels that only cross. Click a vessel that makes no sense to drop it.</p>
          <p class="note" id="junctions-note"></p>
          <div id="task-stage"><div id="task-card"></div></div>
          <button id="area-done" class="primary" type="button">Area done</button></div>
        <p class="note" id="peek-note">Hold Ctrl to see the model alone.</p>
      </div>
    </div>
</template>
<template data-slot="toolbar">
      <button type="button" id="vm-focus" class="big" hidden>Back to image</button>
      <details class="menu" id="vm-show">
        <summary>Show</summary>
        <div class="pop">
          <div class="seg" id="model-mode" role="group" aria-label="Show">
            <button type="button" data-v="image" aria-pressed="true" title="The stack alone">Image</button>
            <button type="button" data-v="model" aria-pressed="false" title="The vessel model alone" disabled>Model</button>
            <button type="button" data-v="overlay" aria-pressed="false" title="The vessel model over the stack" disabled>Overlay</button>
            <button type="button" data-v="side" aria-pressed="false" title="The stack and the vessel model side by side, turning together" disabled>Side by side</button>
          </div>
          <label title="Draw each vessel as wide as the model says"><input type="checkbox" id="m-widths" checked> Vessel widths</label>
          <label id="m-candidates-row" title="The faint vessels the algorithm was unsure of, faded" hidden><input type="checkbox" id="m-candidates" checked> Low-confidence vessels</label>
          <label id="m-cut-row" title="While you tag: each area done in every step, blacked out of the stack" hidden><input type="checkbox" id="m-cut" checked disabled> Cut out what is done</label>
          <div id="vm-review" class="col" hidden>
            <div class="seg" id="review-mode" role="group" aria-label="Signal kept" title="The whole stack.">
              <button type="button" data-v="all" aria-pressed="true">Everything</button>
              <button type="button" data-v="detected" aria-pressed="false">Detected</button>
              <button type="button" data-v="missed" aria-pressed="false">Missed</button>
            </div>
            <label id="reach-row" title="How far beyond the vessel wall the signal counts as the vessel's, a share of its width" hidden>Reach <input type="range" id="reach" min="0" max="200" step="5" value="50"> <output id="reach-o"></output></label>
          </div>
        </div>
      </details>
</template>
<template data-slot="views">
    <div id="items-view" hidden>
      <div class="items-bar">
        <div class="seg" id="item-kind">
          <button type="button" data-v="junctions" aria-pressed="true">Junctions <span class="count"></span></button>
          <button type="button" data-v="vessels" aria-pressed="false">Vessels <span class="count"></span></button>
        </div>
        <select id="item-filter" aria-label="Which items">
          <option value="all" data-for="junctions vessels">All</option>
          <option value="review" data-for="junctions vessels">Worth a look</option>
          <option value="declined" data-for="vessels">Declined</option>
        </select>
        <select id="item-sort" aria-label="Order">
          <option value="file" data-for="junctions vessels">In file order</option>
          <option value="short" data-for="vessels">Shortest first</option>
          <option value="wide" data-for="vessels">Widest first</option>
          <option value="branches" data-for="junctions">Most branches first</option>
          <option value="crowd" data-for="junctions">Most crowded first</option>
        </select>
        <span class="dim" id="items-note"></span>
      </div>
      <div class="items-scroll">
        <p class="hint" id="items-empty">Execute the algorithm, or load a vessel model, to see it item by item: a card for each junction and each vessel.</p>
        <div class="cards" id="item-list"></div>
      </div>
    </div>
</template>
<template data-slot="body">
<div id="ctx" class="pop" role="menu" hidden></div>
</template>
