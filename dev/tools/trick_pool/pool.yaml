  hook: post
  scale: level in gradient units (tie to noise gradient magnitude)
  package: SimpleITK
  invoke: sitk.MorphologicalWatershed(sitk.GetImageFromArray(grad), level=L, markWatershedLine=False,
    fullyConnected=True)
  docs: https://simpleitk.org/doxygen/latest/html/classitk_1_1simple_1_1MorphologicalWatershedImageFilter.html
  cost: medium
  verified: true
  try_when: 'You have no reliable markers but need regions whose boundaries follow real valleys.

    '
- id: snow-partitioning
  name: SNOW partitioning (porespy)
  family: grouping
  visual: 'Splits a binary mask of a connected network into its pores/chambers at the constrictions, with
    a filter that drops spurious saddle peaks.

    '
  how: 'Sub-Network of an Over-segmented Watershed: EDT, smooth, find peaks, trim saddle and plateau peaks,
    merge nearby ones, then marker watershed on the EDT (Gostick 2017).

    '
  canonical_uses:
  - pore network extraction
  - porous media
  - splitting a vessel mask into segments at bulges
  hook: post
  scale: sigma ~ 0.3-0.5 x typical radius; r_max ~ minimum peak spacing
  package: porespy
  invoke: porespy.filters.snow_partitioning(im=mask, dt=None, r_max=4, sigma=0.4).regions
  docs: https://porespy.org/modules/generated/generated/porespy.filters.snow_partitioning.html
  cost: light
  verified: true
  try_when: 'Distance-transform watershed over-splits elongated objects (vessels, paranodes) into many
    beads because their EDT ridge has many tiny local maxima.

    '
- id: random-walker
  name: Random walker segmentation
  family: grouping
  visual: 'From a few labelled seeds, each unlabelled pixel gets the label of whichever seed a random
    walk starting there is most likely to reach first; boundaries settle on strong edges even where they
    are weak or broken.

    '
  how: 'Solves a sparse Laplacian (Dirichlet) system with edge weights exp(-beta*dI^2) (Grady 2006); return_full_prob
    gives per-label probabilities usable as soft scores.

    '
  canonical_uses:
  - seeded segmentation of noisy data
  - 3D micro-CT phases
  - interactive cut-outs
  hook: post
  scale: beta scale-free once data is normalized to unit range
  package: scikit-image
  invoke: skimage.segmentation.random_walker(img, markers, beta=130, mode='cg_j', return_full_prob=True)
  docs: https://scikit-image.org/docs/stable/api/skimage.segmentation.html#skimage.segmentation.random_walker
  cost: light
  verified: true
  try_when: 'Seeds are reliable (detections are right) but region extents are wrong or noisy, especially
    across weak/broken boundaries.

    '
- id: graph-cut-maxflow
  name: Graph cut (s-t min-cut / max-flow)
  family: grouping
  visual: 'Finds the globally best foreground/background labelling that balances ''this pixel looks like
    object'' against ''neighbours should agree'', yielding smooth, gap-free masks.

    '
  how: 'Builds a grid graph with n-links (smoothness weight) and t-links (per-pixel data cost) and solves
    min-cut with the Boykov-Kolmogorov algorithm.

    '
  canonical_uses:
  - binary denoising
  - interactive segmentation
  - foreground extraction
  hook: post
  scale: smoothness weight relative to data-term range; scale-free if both are log-likelihoods
  package: PyMaxflow
  invoke: g = maxflow.Graph[float](); ids = g.add_grid_nodes(img.shape); g.add_grid_edges(ids, w); g.add_grid_tedges(ids,
    cost_fg, cost_bg); g.maxflow(); seg = g.get_grid_segments(ids)
  docs: https://pmneila.github.io/PyMaxflow/maxflow.html
  cost: light
  verified: true
  try_when: 'A thresholded probability/score map is right on average but speckled and holey: pixelwise
    decisions need spatial regularization.

    '
- id: grabcut
  name: GrabCut
  family: grouping
  visual: 'Given a box around an object, iteratively learns colour models for inside and outside and cuts
    the object out along its true boundary.

    '
  how: 'Alternates Gaussian-mixture colour models for fg/bg with a graph-cut labelling (Rother 2004);
    can be initialized with a mask instead of a rectangle.

    '
  canonical_uses:
  - interactive foreground extraction
  - refining a bounding box into a mask
  hook: post
  scale: rect ~ candidate bounding box padded by ~50%
  package: opencv-contrib-python
  invoke: mask = np.zeros(img.shape[:2], np.uint8); bgd = np.zeros((1,65), np.float64); fgd = np.zeros((1,65),
    np.float64); cv2.grabCut(img8_bgr, mask, (x, y, w, h), bgd, fgd, 5, cv2.GC_INIT_WITH_RECT)
  docs: https://docs.opencv.org/4.x/d8/d83/tutorial_py_grabcut.html
  cost: medium
  verified: true
  try_when: 'A candidate''s box is right but its mask is not; 2-channel data can be passed as a 3-channel
    image (e.g. R, G, R-G) so the colour model separates red dot from green paranode.

    '
- id: dense-crf
  name: Fully-connected CRF (DenseCRF)
  family: grouping
  visual: 'Sharpens a blurry per-pixel probability map so labels snap to image edges and small inconsistent
    islands disappear.

    '
  how: 'Mean-field inference in a CRF where every pixel pair is connected through Gaussian and bilateral
    (position + colour) kernels, made fast by permutohedral filtering (Kraehenbuehl 2011).

    '
  canonical_uses:
  - post-processing CNN semantic segmentation
  - edge-aligned label refinement
  hook: post
  scale: sxy ~ object radius for the bilateral term, ~3 px for smoothing; srgb in intensity units
  package: pydensecrf
  invoke: d = dcrf.DenseCRF2D(W, H, n_labels); d.setUnaryEnergy(unary_from_softmax(probs)); d.addPairwiseGaussian(sxy=3,
    compat=3); d.addPairwiseBilateral(sxy=80, srgb=13, rgbim=img8_rgb, compat=10); Q = np.array(d.inference(5)).reshape(n_labels,
    H, W)
  docs: https://github.com/lucasb-eyer/pydensecrf
  cost: medium
  verified: false
  try_when: 'A score map has the right blobs but their outlines are bloated by blur (PSF), so areas or
    calibers are over-estimated. Note: wheels are often unavailable; may need a source build.

    '
- id: rag-merge-hierarchical
  name: Region adjacency graph merging
  family: grouping
  visual: 'Starts from an over-segmentation and fuses neighbouring pieces whose mean intensity (or any
    feature) is similar until only distinct regions remain.

    '
  how: 'Build a RAG of superpixels with edge weight = colour difference (rag_mean_color) or boundary strength
    (rag_boundary); greedily merge the lowest-weight edge below a threshold, updating weights (merge_hierarchical),
    or cut once (cut_threshold).

    '
  canonical_uses:
  - superpixel-to-object merging
  - over-segmentation repair
  hook: post
  scale: thresh in intensity/feature units
  package: scikit-image
  invoke: rag = skimage.graph.rag_mean_color(img, labels); merged = skimage.graph.cut_threshold(labels,
    rag, thresh)
  docs: https://scikit-image.org/docs/stable/api/skimage.graph.html#skimage.graph.rag_mean_color
  cost: light
  verified: true
  try_when: 'Objects are fragmented into several pieces (a vessel broken into chunks, a node split into
    two) and a simple dilation would also merge true neighbours.

    '
- id: normalized-cut
  name: Normalized cut on a region graph
  family: grouping
  visual: 'Divides a region graph into groups that are internally similar and weakly connected to each
    other, avoiding the tiny-isolated-piece bias of plain min-cut.

    '
  how: 'Recursive two-way spectral partitioning of the RAG using the second eigenvector of the normalized
    Laplacian (Shi & Malik 2000).

    '
  canonical_uses:
  - perceptual grouping of superpixels
  - image partitioning
  hook: post
  scale: none (graph-level)
  package: scikit-image
  invoke: rag = skimage.graph.rag_mean_color(img, labels, mode='similarity'); out = skimage.graph.cut_normalized(labels,
    rag, thresh=0.001, num_cuts=10)
  docs: https://scikit-image.org/docs/stable/api/skimage.graph.html#skimage.graph.cut_normalized
  cost: light
  verified: true
  try_when: 'Threshold-based RAG merging either chains everything together or leaves fragments; you want
    a balanced global partition.

    '
- id: chan-vese
  name: Chan-Vese (active contours without edges)
  family: grouping
  visual: 'A contour that moves to the place where inside and outside are each as uniform as possible,
    finding objects without needing sharp edges.

    '
  how: 'Level-set minimization of the Mumford-Shah piecewise-constant energy: mu*length + lambda1*sum(I-c1)^2
    inside + lambda2*sum(I-c2)^2 outside. The morphological variant (morphological_chan_vese) replaces
    PDEs with morphological operators: faster, more stable.

    '
  canonical_uses:
  - blurry-boundary objects
  - medical lesion segmentation
  - per-object refinement
  hook: post
  scale: mu ~ smoothness (relative to object perimeter); smoothing iterations ~ 1-3
  package: scikit-image
  invoke: skimage.segmentation.morphological_chan_vese(crop, num_iter=50, init_level_set=init_mask, smoothing=1)
  docs: https://scikit-image.org/docs/stable/api/skimage.segmentation.html#skimage.segmentation.morphological_chan_vese
  cost: light
  verified: true
  try_when: 'Object edges are soft (diffraction-limited dots, out-of-focus vessels), so gradient-based
    boundaries wander; run per candidate crop initialized from its current mask.

    '
- id: morph-geodesic-active-contour
  name: Morphological geodesic active contour
  family: grouping
  visual: 'A balloon that inflates (or shrinks) from a seed and stops where the image gradient is strong,
    wrapping tightly around the object''s edge.

    '
  how: 'Morphological snakes approximation of GAC (Marquez-Neila 2014) on an edge-stopping image g = inverse_gaussian_gradient(I);
    balloon > 0 inflates, < 0 deflates.

    '
  canonical_uses:
  - organ/lesion outlining
  - refining seeds into masks
  hook: post
  scale: sigma of inverse_gaussian_gradient ~ edge width; num_iter ~ object radius
  package: scikit-image
  invoke: g = skimage.segmentation.inverse_gaussian_gradient(crop, alpha=100, sigma=s); skimage.segmentation.morphological_geodesic_active_contour(g,
    num_iter=n, init_level_set=seed_mask, smoothing=1, balloon=1)
  docs: https://scikit-image.org/docs/stable/api/skimage.segmentation.html#skimage.segmentation.morphological_geodesic_active_contour
  cost: light
  verified: true
  try_when: 'You have a good seed per object but threshold masks bleed through weak edges; GAC stops at
    the edge.

    '
- id: snake-active-contour
  name: Parametric snake (Kass active contour)
  family: grouping
  visual: 'A string of points that shrinks or slides onto nearby edges or ridges while staying smooth;
    can be open (to fit a line) or closed (to fit an outline).

    '
  how: 'Minimizes internal energy (alpha: elasticity, beta: rigidity) plus external energy from edges
