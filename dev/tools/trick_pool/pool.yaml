  - fitting a vessel centreline
  - cell outline refinement
  - lip/contour tracking
  hook: post
  scale: alpha/beta relative to point spacing; smooth the image to object scale first
  package: scikit-image
  invoke: skimage.segmentation.active_contour(skimage.filters.gaussian(img, s), init_rc, alpha=0.01, beta=1.0,
    w_line=1, w_edge=0, boundary_condition='fixed')
  docs: https://scikit-image.org/docs/stable/api/skimage.segmentation.html#skimage.segmentation.active_contour
  cost: light
  verified: true
  try_when: 'A traced centreline is jagged or offset from the true ridge and lengths are inflated by zig-zag;
    an open snake with w_line > 0 relaxes it onto the bright ridge.

    '
- id: threshold-level-set-itk
  name: Threshold / shape-detection level set (ITK)
  family: grouping
  visual: 'A front that propagates through pixels inside an intensity band and stops outside it, with
