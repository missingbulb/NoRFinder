  invoke: img > skimage.filters.threshold_li(img, initial_guess=skimage.filters.threshold_otsu(img))
  docs: https://scikit-image.org/docs/stable/api/skimage.filters.html#skimage.filters.threshold_li
  cost: light
  verified: true
  try_when: 'Otsu masks are systematically thinner than ground-truth outlines (object area under-estimated).

    '
- id: sauvola-threshold
  name: Sauvola local threshold
  family: grouping
  visual: 'Raises the bar in textured, high-variance areas and lowers it in flat areas, so speckled background
    stays black while low-contrast objects on flat background are found.

    '
  how: 'T = m * (1 + k * (s / R - 1)) with local mean m and std s in a window; R is the dynamic range
    of std. Niblack (T = m + k s) is the older variant.

    '
  canonical_uses:
  - document binarization
  - text on stained paper
  - uneven microscopy backgrounds
  hook: map
  scale: window_size ~ 2-4x object diameter (odd)
  package: scikit-image
  invoke: img > skimage.filters.threshold_sauvola(img, window_size=w, k=0.2)
  docs: https://scikit-image.org/docs/stable/api/skimage.filters.html#skimage.filters.threshold_sauvola
  cost: light
  verified: true
  try_when: 'A mean-based local threshold fires on textured background (neuropil, autofluorescent tissue)
    while missing faint objects in clean areas.

    '
- id: bernsen-local-contrast
  name: Bernsen local-contrast threshold
  family: grouping
  visual: 'Thresholds each pixel at the midpoint of local min and max, but only where the local contrast
    is high enough; flat regions are assigned to background wholesale.

    '
  how: 'T(x) = (max_W + min_W)/2 if (max_W - min_W) >= contrast_threshold else a global fallback. gbernsen
    generalizes the window to any structuring element.

    '
  canonical_uses:
  - document images
  - barcodes
  - local-contrast-driven binarization
  hook: map
  scale: radius ~ object radius to 2x; contrast_threshold in intensity units (tie to noise)
  package: mahotas
  invoke: mahotas.thresholding.bernsen(img, radius, contrast_threshold, gthresh=None)
  docs: https://mahotas.readthedocs.io/en/latest/thresholding.html
  cost: light
  verified: true
  try_when: 'Objects are defined by local contrast rather than absolute brightness and noise floors in
    empty regions keep spawning false objects with mean-based local thresholds.

    '
- id: rank-otsu-local
  name: Local Otsu (rank filter)
  family: grouping
  visual: 'Runs Otsu inside a moving disk, giving a threshold map that adapts to regional histogram shape
    rather than only regional mean.

    '
  how: 'For each pixel, the Otsu threshold of the uint8 histogram inside the footprint; compare the image
    with that map.

    '
  canonical_uses:
  - heterogeneous illumination
  - tiles with different contrast regimes
  hook: map
  scale: footprint radius ~ several object diameters (must contain both classes)
  package: scikit-image
  invoke: img8 >= skimage.filters.rank.otsu(img8, skimage.morphology.disk(r))
  docs: https://scikit-image.org/docs/stable/api/skimage.filters.rank.html#skimage.filters.rank.otsu
  cost: light
  verified: true
  try_when: 'Contrast, not just brightness, varies across the field (e.g. depth attenuation in a z-stack),
    and a single global or mean-based threshold fails in some regions.

    '
  runnable: local-otsu-margin
- id: threshold-minimum-valley
  name: Minimum (histogram valley) threshold
  family: grouping
  visual: 'Smooths the histogram until it has exactly two peaks and cuts at the trough between them.

    '
  how: 'Repeated 3-bin mean smoothing of the histogram until bimodal (Prewitt & Mendelsohn), then threshold
    at the minimum between the two maxima.

    '
  canonical_uses:
  - clearly bimodal images
  - quick sanity threshold
  hook: map
  scale: none
  package: scikit-image
  invoke: img > skimage.filters.threshold_minimum(img, nbins=256)
  docs: https://scikit-image.org/docs/stable/api/skimage.filters.html#skimage.filters.threshold_minimum
  cost: light
  verified: true
  try_when: 'The histogram of a per-candidate score (not just pixels) looks bimodal and you need a data-driven
    cut between true and false candidates. Raises if no bimodality: catch that as ''no valley''.

    '
- id: confidence-connected
  name: Confidence-connected region growing
  family: grouping
  visual: 'Starts from a seed and grows into neighbours whose intensity is within a few standard deviations
    of the region''s own running mean, re-estimating as it grows.

    '
  how: 'Initial mean/std from a small neighbourhood of the seeds; include connected pixels in [mean -
    m*std, mean + m*std]; recompute statistics from the region and repeat for N iterations.

    '
  canonical_uses:
  - organ segmentation from a click
  - vessel lumen from a seed
  - liver lesions
  hook: post
  scale: initialNeighborhoodRadius ~ 1-2 px; multiplier is scale-free
  package: SimpleITK
  invoke: sitk.ConfidenceConnected(sitk.GetImageFromArray(img), seedList=[(x, y)], numberOfIterations=4,
    multiplier=2.5, initialNeighborhoodRadius=1, replaceValue=1)
  docs: https://simpleitk.org/doxygen/latest/html/classitk_1_1simple_1_1ConfidenceConnectedImageFilter.html
  cost: medium
  verified: true
  try_when: 'Point detections are right but object extents are wrong (areas, lengths far from ground truth)
    because a fixed threshold does not fit each object''s own brightness.

    '
- id: flood-tolerance
  name: Flood fill with tolerance
  family: grouping
  visual: 'From one seed, paints all connected pixels within +/- tol of the seed''s own value: a per-object
    ''magic wand''.

    '
  how: 'Breadth-first fill over the footprint connectivity, admitting neighbours with |I - I_seed| <=
    tolerance; returns a boolean mask.

    '
  canonical_uses:
  - interactive selection
  - per-seed object extent
  - background region picking
  hook: post
  scale: tolerance in intensity units, set as a fraction of the seed's value (e.g. 0.5*I_seed for FWHM-like
    extents)
  package: scikit-image
  invoke: skimage.segmentation.flood(img, (r, c), tolerance=t)
  docs: https://scikit-image.org/docs/stable/api/skimage.segmentation.html#skimage.segmentation.flood
  cost: light
  verified: true
  try_when: 'Each detected peak needs its own extent (e.g. half-maximum region of a red dot) and a global
    threshold merges neighbours or under-sizes dim ones.

    '
- id: isolated-connected
  name: Isolated-connected threshold (two-seed separation)
  family: grouping
  visual: 'Given a seed inside an object and a seed in something you must not include, finds the threshold
    that grows the first region as far as possible without ever reaching the second.

    '
  how: 'Binary search on the upper (or lower) threshold of connected-threshold growth from seed1 until
    seed2 is just excluded.

    '
