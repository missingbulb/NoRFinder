    '
  canonical_uses:
  - structured object detection
  - part-based models
  - synapse/node motif detection
  hook: verify
  scale: R ~ expected node+paranode length; angle and ratio tolerances scale-free
  package: scipy
  invoke: nbrs = scipy.spatial.cKDTree(green_pts).query_ball_point(red_pts, r=R); score pairs in numpy
  docs: https://docs.scipy.org/doc/scipy/reference/generated/scipy.spatial.cKDTree.query_ball_point.html
  cost: light
  verified: true
  try_when: 'The red-dot detector keeps red blobs next to a single green structure (paranode end, heminode)
    or in green-rich areas without the bilateral motif.

    '
- id: paranode-pairing-matching
  name: Paranode pairing by maximum-weight matching
  family: grouping
  visual: 'Pairs green blobs two by two so that each pair looks like the two halves of one node, with
    no blob used twice; leftovers are heminodes or noise.

    '
  how: 'Graph with green blobs as vertices and edges for plausible pairs (distance, axis alignment, similar
