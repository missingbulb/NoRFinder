  docs: https://networkx.org/documentation/stable/reference/algorithms/generated/networkx.algorithms.matching.max_weight_matching.html
  cost: light
  verified: true
  try_when: 'Nodes are missed because the red dot is dim, while the two green paranodes are clear: a candidate
    source driven by green structure; or one green blob is shared by two claimed nodes.

    '
- id: hungarian-matching
  name: Hungarian (linear sum) assignment
  family: grouping
  visual: 'One-to-one pairing of predicted objects with ground-truth objects that minimizes total distance,
    so a double detection can not both claim one truth.

    '
  how: 'Solves the rectangular assignment problem on a cost matrix (distances, 1 - IoU); entries above
