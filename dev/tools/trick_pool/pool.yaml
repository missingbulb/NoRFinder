    '
  canonical_uses:
  - over-segmentation for RAG merging
  - region-level features
  - annotation speed-up
  hook: candidates
  scale: n_segments ~ image area / (object area); compactness relative to intensity range
  package: scikit-image
  invoke: skimage.segmentation.slic(img, n_segments=n, compactness=c, channel_axis=None, mask=fg)
  docs: https://scikit-image.org/docs/stable/api/skimage.segmentation.html#skimage.segmentation.slic
  cost: light
  verified: true
  try_when: 'Pixel-level classification is noisy; scoring region-level features (mean R, mean G, texture)
    on superpixels gives more stable decisions. Also: cv2.ximgproc.createSuperpixelLSC / createSuperpixelSEEDS
    for alternative tilings; sitk.SLIC for 3D stacks.

    '
- id: felzenszwalb-graph
  name: Felzenszwalb-Huttenlocher graph segmentation
  family: grouping
  visual: 'Merges pixels into regions as long as the edge between them is weaker than the variation already
    inside each region: small textured regions survive, smooth gradients do not break.

    '
  how: 'Kruskal-style merging of sorted edges with an adaptive internal-difference criterion Int(C) +
    k/|C|; min_size post-merges tiny regions.

    '
  canonical_uses:
  - fast over-segmentation
  - selective search proposals
  hook: candidates
  scale: scale k ~ preferred region size in px; min_size ~ smallest object area
  package: scikit-image
  invoke: skimage.segmentation.felzenszwalb(img, scale=k, sigma=0.8, min_size=m, channel_axis=None)
  docs: https://scikit-image.org/docs/stable/api/skimage.segmentation.html#skimage.segmentation.felzenszwalb
  cost: light
  verified: true
  try_when: 'You need region proposals of irregular size and shape (vessel pieces, tissue patches) that
    a compact superpixel would chop up.

    '
- id: quickshift
  name: Quickshift
  family: grouping
  visual: 'Links each pixel to its nearest neighbour of higher density, forming a forest; cutting long
    links gives mode-seeking regions of varied size.

    '
  how: 'Kernel density in (colour, position) space; each pixel points to the closest pixel with higher
    density within max_dist; trees are the segments (Vedaldi & Soatto 2008).

    '
  canonical_uses:
  - superpixels
  - mode seeking
  hook: candidates
  scale: kernel_size ~ object radius; max_dist ~ object diameter
  package: scikit-image
  invoke: skimage.segmentation.quickshift(img_rgb, ratio=1.0, kernel_size=k, max_dist=d, convert2lab=False)
  docs: https://scikit-image.org/docs/stable/api/skimage.segmentation.html#skimage.segmentation.quickshift
  cost: light
  verified: true
  try_when: 'Objects are best defined as density modes in the joint (R, G, x, y) space, e.g. a red-green
    composite where each node is a mode.

    '
- id: selective-search
  name: Selective search object proposals
  family: grouping
  visual: 'Produces a ranked list of boxes by repeatedly merging Felzenszwalb regions under colour, texture,
    size and fill similarity; small, compact, distinct things show up as boxes.

    '
  how: 'Hierarchical grouping of an initial graph segmentation using a mix of similarity strategies across
    several colour spaces (Uijlings 2013).

    '
  canonical_uses:
  - object proposals for R-CNN
  - generic object candidates
  hook: candidates
  scale: base segmentation k ~ smallest object area
  package: opencv-contrib-python
  invoke: ss = cv2.ximgproc.segmentation.createSelectiveSearchSegmentation(); ss.setBaseImage(img8_bgr);
    ss.switchToSelectiveSearchFast(); boxes = ss.process()
  docs: https://docs.opencv.org/4.x/d6/d6d/classcv_1_1ximgproc_1_1segmentation_1_1SelectiveSearchSegmentation.html
  cost: medium
  verified: true
  try_when: 'A detector misses objects whose shape is atypical and all your proposals come from one peak/threshold
    mechanism; this is a structurally different proposal source.

    '
- id: minimal-path-route
  name: Minimal path (geodesic shortest path)
  family: grouping
  visual: 'Draws the cheapest route between two points through a cost image, which on a vesselness or
    brightness-derived cost is the vessel''s centreline, even across faint gaps.

    '
  how: 'Dijkstra on the pixel grid with cost = f(image), e.g. 1/(eps + vesselness); geometric=True weights
    diagonal moves by sqrt(2).

    '
  canonical_uses:
  - vessel and neurite centrelines
  - road extraction
  - contour completion between endpoints
  hook: post
  scale: none (cost map built at the vessel scale)
  package: scikit-image
  invoke: path, cost = skimage.graph.route_through_array(1.0/(eps + vesselness), start, end, fully_connected=True,
    geometric=True)
  docs: https://scikit-image.org/docs/stable/api/skimage.graph.html#skimage.graph.route_through_array
  cost: light
  verified: true
  try_when: 'A skeleton breaks at dim stretches and segments are over-counted; join endpoint pairs with
    minimal paths and accept the join if the path''s mean cost is low.

    '
- id: mcp-geodesic-distance
  name: Multi-seed minimum cost path / geodesic distance map
  family: grouping
  visual: 'From a set of seeds, a map of how ''far'' every pixel is along the cheapest route; along a
    bright vessel distance grows slowly, across dark background it grows fast.

    '
  how: 'MCP_Geometric(costs).find_costs(starts) computes cumulative costs and a traceback; with multiple
    seeds it also yields a geodesic Voronoi partition. traceback(end) returns paths.

    '
  canonical_uses:
  - vessel tree extraction from a root
  - geodesic Voronoi
  - path tracing
  hook: post
  scale: none
  package: scikit-image
  invoke: m = skimage.graph.MCP_Geometric(costs); cum, tb = m.find_costs(seeds); path = m.traceback(end)
  docs: https://scikit-image.org/docs/stable/api/skimage.graph.html#skimage.graph.MCP_Geometric
  cost: light
  verified: true
  try_when: 'Assigning pixels to the nearest object by straight-line distance crosses dark gaps; use geodesic
    distance through the image instead (e.g. which paranode a dim pixel belongs to).

    '
- id: fast-marching
  name: Fast marching (Eikonal front propagation)
  family: grouping
  visual: 'A front spreads from seeds at a speed set by the image (fast on bright structures, slow on
    background); the arrival-time map thresholded at T gives a smooth, leak-resistant region.

    '
  how: 'Solves |grad T| * F = 1 with an upwind scheme (Sethian); sub-pixel accurate unlike Dijkstra. ITK''s
    FastMarching takes a speed image and trial seeds.

    '
  canonical_uses:
  - vessel segmentation
  - geodesic distances
  - level-set initialization
  hook: post
  scale: stoppingValue in time units = path length / speed
  package: SimpleITK
  invoke: sitk.FastMarching(sitk.GetImageFromArray(speed), trialPoints=[(x, y)], normalizationFactor=1.0,
    stoppingValue=T)
  docs: https://simpleitk.org/doxygen/latest/html/classitk_1_1simple_1_1FastMarchingImageFilter.html
  cost: medium
  verified: true
  try_when: 'Dijkstra minimal paths look metrically biased (staircase along 8 directions, length over-estimate)
    or you need a sub-pixel arrival map.

    '
- id: colliding-fronts
  name: Colliding fronts
  family: grouping
  visual: 'Two fronts are launched from two seeds and the region where they meet, travelling fastest,
    is the tube connecting the seeds: segments one vessel stretch between two points.

    '
  how: 'Sum of two fast-marching arrival-time maps'' gradients; pixels where the fronts move against each
    other (negative dot product) form the connecting structure (Deschamps & Cohen).

    '
  canonical_uses:
  - segmenting a vessel segment between two clicks
  - tubular structure extraction
  hook: post
  scale: none
  package: SimpleITK
  invoke: sitk.CollidingFronts(sitk.GetImageFromArray(speed), seedPoints1=[[x1, y1]], seedPoints2=[[x2,
    y2]], applyConnectivity=True)
  docs: https://simpleitk.org/doxygen/latest/html/classitk_1_1simple_1_1CollidingFrontsImageFilter.html
  cost: medium
  verified: true
  try_when: 'Branch endpoints are known but the segment''s own mask (for caliber) is unreliable; this
    yields a mask of only the connecting vessel.

    '
- id: skeleton-graph-skan
  name: Skeleton graph branch analysis (skan)
  family: grouping
  visual: 'Turns a mask''s skeleton into a network: each branch between junctions/tips becomes a counted
    edge with its own length and mean intensity/width.

    '
  how: 'Skeletonize; skan builds a pixel graph and summarize() returns a table of branches with branch-distance,
    euclidean-distance, branch-type (tip-tip, tip-junction, junction-junction, cycle) and mean pixel value
    under an optional intensity/EDT image.

    '
  canonical_uses:
  - vessel/neurite morphometry
  - branch counting
  - length and tortuosity
  hook: stats
  scale: spacing = pixel size (um/px) to get physical lengths
  package: skan
  invoke: sk = skan.Skeleton(skimage.morphology.skeletonize(mask), spacing=px_um, source_image=edt); df
    = skan.summarize(sk, separator='_')
  docs: https://skeleton-analysis.org/stable/api/skan.csr.html
  cost: light
  verified: true
  try_when: 'Segment counts and total length differ from ground truth and you need per-branch numbers
    to see where (spurs, cycles, double-counted junction clusters). Directly computes the locked vascular
    COUNT (segments) and MEASURE (centreline length) metrics.

    '
- id: skeleton-spur-pruning
  name: Spur pruning by branch length / caliber ratio
  family: grouping
  visual: 'Removes the short whiskers a skeleton grows on a thick, bumpy vessel, leaving the true centreline
    and genuine side branches.

    '
  how: 'From the skan branch table, delete tip-junction branches whose length is less than c x the local
    radius (EDT at the junction), iterate until stable, then re-skeletonize.

    '
  canonical_uses:
  - skeleton cleanup
  - vessel tree simplification
  - medial-axis pruning
  hook: post
  scale: c x local radius (scale-free)
  package: skan
  invoke: df = skan.summarize(sk, separator='_'); spurs = df[(df.branch_type == 1) & (df.branch_distance
    < c * df.mean_pixel_value)]; then erase sk.path_coordinates(i) for i in spurs.index
  docs: https://skeleton-analysis.org/stable/api/skan.csr.html
  cost: light
  verified: false
  try_when: 'Segment count is inflated by many short tip branches on thick vessels; a fixed-pixel spur
    length works at one magnification and fails at another.

    '
- id: medial-axis-caliber
  name: Medial axis with distance (caliber)
  family: grouping
  visual: 'The centreline of every structure, each point labelled with its distance to the nearest edge:
    twice that is the local vessel diameter.

    '
  how: 'Medial axis transform via skeletonization of the distance transform; return_distance gives the
    EDT along the axis for caliber histograms.

    '
  canonical_uses:
  - vessel caliber categorization
  - width profiles
  - shape description
  hook: stats
  scale: none (returns px; multiply by pixel size)
  package: scikit-image
  invoke: skel, dist = skimage.morphology.medial_axis(mask, return_distance=True); calibers = 2 * dist[skel]
  docs: https://scikit-image.org/docs/stable/api/skimage.morphology.html#skimage.morphology.medial_axis
  cost: light
  verified: true
  try_when: 'Caliber categories disagree with ground truth; compare medial-axis widths with skeletonize
    + EDT, and with thinning variants (cv2.ximgproc.thinning, THINNING_GUOHALL) which give different centrelines
    at junctions.

    '
- id: junction-cluster-merge
  name: Junction-cluster collapse
  family: grouping
  visual: 'Where a skeleton forms a little knot of several junction pixels at one real branch point, collapses
    the knot into one node so one bifurcation is not counted as three segments.

    '
  how: 'Neighbour-count convolution marks junction pixels (>=3 neighbours); label junction pixels with
    a dilation of radius ~ local vessel radius; each label is one graph node. Edges are the skeleton pieces
    between nodes.

    '
  canonical_uses:
  - vascular graph building
  - road network topology
  - crack networks
  hook: post
  scale: merge radius ~ local vessel radius (EDT)
  package: scipy
  invoke: nb = ndi.convolve(skel.astype(np.uint8), np.ones((3,3), int), mode='constant') - skel; nodes,
    n = ndi.label(ndi.binary_dilation(skel & (nb >= 3), iterations=k))
  docs: https://docs.scipy.org/doc/scipy/reference/generated/scipy.ndimage.label.html
  cost: light
  verified: true
  try_when: 'Segment counts are higher than ground truth with excess very short junction-junction segments
    (< vessel width).

    '
- id: mst-gap-bridging
  name: Endpoint linking by MST / co-linearity (contour completion)
  family: grouping
  visual: 'Connects broken pieces of a line-like structure by bridging gaps between endpoints that point
    at each other, the way the eye completes a dashed line.

    '
  how: 'Collect skeleton endpoints with their tangent directions; candidate links within radius R (cKDTree.query_pairs),
    scored by gap length, angle between tangents and the link direction (good continuation), and mean
    intensity along the link; keep links via a minimum spanning tree or greedy best-first.

    '
  canonical_uses:
  - vessel and neurite reconnection
  - edge linking
  - road gap filling
  - contour completion
  hook: post
  scale: R ~ a few vessel diameters; angle tolerance scale-free
  package: scipy
  invoke: pairs = scipy.spatial.cKDTree(endpoints).query_pairs(R); score each; mst = scipy.sparse.csgraph.minimum_spanning_tree(W)
  docs: https://docs.scipy.org/doc/scipy/reference/generated/scipy.spatial.cKDTree.query_pairs.html
  cost: light
  verified: true
  try_when: 'Vessels fragment at dim stretches (z attenuation, branch crossing out of plane) so connected-component
    counts and short-segment counts are too high.

    '
- id: tensor-voting
  name: Tensor voting
  family: grouping
  visual: 'Every edge or ridge fragment casts votes for smooth curves continuing from it; where many fragments
    agree, a strong continuous curve appears, filling gaps and suppressing clutter.

    '
  how: 'Each token''s orientation tensor is propagated with a stick voting field decaying with arc length
    and curvature (Medioni, Lee & Tang 2000); the eigen-decomposition of accumulated tensors gives curve
    saliency (l1 - l2). Can be computed with steerable filters (Franken et al. 2006) as a few FFT convolutions.

    '
  canonical_uses:
  - perceptual grouping
  - contour completion
  - vessel and fibre gap filling
  hook: map
  scale: sigma (voting field scale) ~ largest gap to bridge in px
  package: none (implement in numpy; no maintained pip package found)
  invoke: no library API; build stick field and convolve per orientation with scipy.signal.fftconvolve,
    or use the steerable-filter formulation
  docs: https://doi.org/10.1007/11744023_18
  cost: light
  verified: false
  try_when: 'Hessian/vesselness responses are broken into dashes along faint or noisy vessels and endpoint-linking
    heuristics are too greedy; tensor voting yields a dense saliency map.

    '
- id: neuron-tracing-app2
  name: Seeded tracing / tree reconstruction (APP2-style)
  family: grouping
  visual: 'Grows a tree from a root through the brightest connected paths, then prunes branches that are
    covered by their parents, giving a clean reconstruction of a filamentous structure.

    '
  how: 'Fast-marching geodesic tree from a seed over a gray-weighted distance, followed by hierarchical
    pruning of redundant branches (Xiao & Peng 2013). Python ports exist (e.g. rivuletpy implements the
    related Rivulet tracing).

    '
  canonical_uses:
  - neuron reconstruction
  - vascular tree extraction
  - root architecture
  hook: candidates
  scale: background threshold in intensity; pruning by coverage ratio (scale-free)
  package: rivuletpy
  invoke: rtrace -f stack.tif -t <threshold>   (CLI per rivuletpy README)
  docs: https://github.com/RivuletStudio/rivuletpy
  cost: medium
  verified: false
  try_when: 'Skeletons of a thresholded mask produce a forest of fragments and spurs; a tracer instead
    builds one connected tree following intensity.

    '
- id: max-tree-attribute
  name: Max-tree attribute filtering (connected operators)
  family: grouping
  visual: 'Removes bright components smaller than a given area (or diameter) at every grey level at once,
    without blurring or shifting edges of what remains.

    '
  how: 'Build the component tree of upper level sets; prune nodes failing an attribute (area, bounding-box
