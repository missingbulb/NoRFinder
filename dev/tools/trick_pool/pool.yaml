    '
  canonical_uses:
  - detection scoring
  - tracking frame-to-frame
  - cross-channel object pairing
  hook: stats
  scale: gate radius ~ object radius
  package: scipy
  invoke: r, c = scipy.optimize.linear_sum_assignment(cost); ok = cost[r, c] < gate
  docs: https://docs.scipy.org/doc/scipy/reference/generated/scipy.optimize.linear_sum_assignment.html
  cost: light
  verified: true
  try_when: 'Greedy nearest matching inflates TP counts in dense regions, or two detectors'' outputs need
    to be fused one-to-one.

    '
- id: optimal-transport-emd
  name: Optimal transport (earth mover's) between distributions or point sets
  family: grouping
  visual: 'The minimum ''work'' to move one distribution (e.g. predicted caliber histogram or point cloud)
    onto another; a single number for how far statistics are from ground truth, plus a plan saying what
    moved where.

    '
  how: 'Exact network-simplex EMD (ot.emd / ot.emd2) between weighted samples with a ground cost matrix
