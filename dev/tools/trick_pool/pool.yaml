  scale: curvatureScaling relative to the narrowest leak to block (px)
  package: SimpleITK
  invoke: sitk.ThresholdSegmentationLevelSet(init_ls, feature_img, lowerThreshold=lo, upperThreshold=hi,
    maximumRMSError=0.02, propagationScaling=1.0, curvatureScaling=0.5, numberOfIterations=1000)
  docs: https://simpleitk.org/doxygen/latest/html/classitk_1_1simple_1_1ThresholdSegmentationLevelSetImageFilter.html
  cost: medium
  verified: true
  try_when: 'Region growing leaks from one object into background or a neighbour through a thin bridge.

    '
- id: slic-superpixels
  name: SLIC superpixels
  family: grouping
  visual: 'Tiles the image into compact, roughly equal-sized patches whose borders hug intensity edges.

    '
  how: 'k-means in joint (intensity/colour, x, y) space seeded on a grid, with a compactness weight trading
