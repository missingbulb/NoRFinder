    actually carry the decision.

    '
  how: 'permutation_importance on held-out data (model-agnostic, unbiased versus impurity importance);
    mutual_info_classif ranks features before modelling. Prunes descriptor banks to a few explainable
    features.

    '
  canonical_uses:
  - feature selection
  - model interpretation
  hook: stats
  scale: none
  package: scikit-learn
  invoke: sklearn.inspection.permutation_importance(clf, X_val, y_val, n_repeats=20).importances_mean
  docs: https://scikit-learn.org/stable/modules/generated/sklearn.inspection.permutation_importance.html
  cost: light
  verified: true
  try_when: 'A big feature bank works but you want to turn it into a small, explainable, hand-checkable
    rule.

    '
- id: pr-curve-operating-point
  name: Precision-recall operating-point selection
  family: learned
  visual: 'Plots every possible score threshold as a precision/recall pair and picks the one that meets
    the hard constraint (say, recall >= 0.95) at best precision.

    '
  how: 'precision_recall_curve on (matched-to-GT, score) over pooled held-out candidates; select the threshold
    by the project''s hard constraint or by F-beta. Replace hand-set thresholds with constraint-driven
    ones.

    '
  canonical_uses:
  - detector threshold tuning
  - medical screening operating points
  hook: stats
  scale: none
  package: scikit-learn
  invoke: prec, rec, thr = sklearn.metrics.precision_recall_curve(y_true, scores)
  docs: https://scikit-learn.org/stable/modules/generated/sklearn.metrics.precision_recall_curve.html
  cost: light
  verified: true
  try_when: 'Thresholds were tuned by eye and the trade between misses and false objects is not under
    control.

    '
- id: umap-candidate-map
  name: UMAP map of candidates for visual QA
  family: learned
  visual: 'Lays every candidate out on a 2-D map where look-alikes sit together; colouring by GT match
    shows at once whether true and false are separable and where the confusions cluster.

    '
  how: 'UMAP (or t-SNE) on standardized descriptors or embeddings; colour by match/miss/false; thumbnail-hover
    reveals what each region is. Diagnostic, not a classifier.

    '
  canonical_uses:
  - single-cell visualization
  - embedding inspection
  - dataset curation
  hook: stats
  scale: n_neighbors ~ 15 relative to candidate count
  package: umap-learn
  invoke: umap.UMAP(n_neighbors=15, min_dist=0.1).fit_transform(Xs)
  docs: https://umap-learn.readthedocs.io/en/latest/basic_usage.html
  cost: medium
  verified: false
  try_when: 'You do not know whether any feature set can separate the persistent false objects from true
    ones, and want to see before building a classifier.

    '
- id: pls-count-regression
  name: Count / density regression from image features (learning to count)
  family: learned
  visual: 'Skips detecting individual objects and directly predicts how many there are in each tile from
    its texture statistics.

    '
  how: 'Per-tile feature vectors (filter-bank histograms) regressed to GT counts (PLSRegression or ridge);
    sum over tiles gives the image count. Lempitsky-Zisserman density counting idea, in its simplest form.
    A cross-check on the detector''s statistics.

    '
  canonical_uses:
  - cell counting
  - crowd counting
  - colony counting
  hook: stats
  scale: tile ~ 5-10x object spacing
  package: scikit-learn
  invoke: sklearn.cross_decomposition.PLSRegression(n_components=3).fit(F_tiles, counts_tiles).predict(F_new)
  docs: https://scikit-learn.org/stable/modules/generated/sklearn.cross_decomposition.PLSRegression.html
  cost: light
  verified: true
  try_when: 'The detector''s per-image count deviates from GT in a consistent direction and you want an
    independent estimate of the summary quantity.

    '
- id: guided-filter
  name: Guided filter (self-guided)
  family: enhancement
  visual: 'Smooths flat regions like a box blur but keeps edges as sharp as the input, without the halos
    a bilateral filter leaves.

    '
  how: 'Fits, in every window of radius r, a linear model of the output as a function of the guide image
    (here the image itself) and averages the overlapping fits; eps sets how strong an edge must be to
    survive.

    '
  canonical_uses:
  - edge-preserving smoothing
  - detail enhancement
  - dehazing
  - matting refinement
  hook: pre
  scale: r ~ object radius
  package: opencv-contrib-python
  invoke: cv2.ximgproc.guidedFilter(f32, f32, r, eps)
  docs: https://docs.opencv.org/4.x/da/d17/group__ximgproc__filters.html
  cost: medium
  verified: true
  try_when: 'Noise breaks objects apart but every smoothing tried so far also blurs neighbouring objects
    into each other.

    '
  runnable: guided-filter
- id: peak-prominence
  name: Peak prominence (h-dome of the smoothed image)
  family: detection
  visual: 'Each bright peak becomes a dome whose height is how far it stands above the saddle towards
    its brighter neighbours; plateaus and slopes go to zero.

    '
  how: 'Smooth, then subtract the morphological reconstruction by dilation of (image - h) under the image,
    with h a multiple of the image''s own standard deviation.

    '
  canonical_uses:
  - spot detection
  - regional maxima filtering
  - topographic prominence
  hook: map
  scale: smoothing ~ 0.3 object radius; h in image standard deviations
  package: scikit-image
  invoke: x - skimage.morphology.reconstruction(x - h, x, method='dilation')
  docs: https://scikit-image.org/docs/stable/api/skimage.morphology.html#skimage.morphology.reconstruction
  cost: light
  verified: true
  try_when: 'Bright objects sit on bright neighbours, so an absolute threshold either merges them or loses
    the dim ones.

    '
  runnable: peak-prominence
- id: distance-to-background
  name: Distance to background
  family: grouping
  visual: 'Inside every foreground object, brightness rises towards its middle; thin objects stay dim,
    thick ones bright.

    '
  how: 'Otsu splits foreground from background, then the Euclidean distance transform gives each foreground
    pixel its distance to the nearest background pixel, in object-scale units.

    '
  canonical_uses:
  - watershed markers
  - thickness and caliber measurement
  - separating touching objects
  hook: map
  scale: output in object-scale units
  package: scipy
  invoke: scipy.ndimage.distance_transform_edt(img > skimage.filters.threshold_otsu(img))
  docs: https://docs.scipy.org/doc/scipy/reference/generated/scipy.ndimage.distance_transform_edt.html
  cost: light
  verified: true
  try_when: 'Real objects differ from false ones in thickness rather than in brightness.

    '
  runnable: distance-to-background
