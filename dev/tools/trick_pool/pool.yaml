    '
- id: nearest-neighbour-g-clark-evans
  name: Nearest-neighbour distance distribution (G function, Clark-Evans ratio)
  family: grouping
  visual: 'Histogram of each detection''s distance to its nearest other detection; a spike at tiny distances
    reveals double detections of one object.

    '
  how: 'cKDTree(points).query(points, k=2) gives NN distances; G(r) is their CDF; Clark-Evans R = mean
