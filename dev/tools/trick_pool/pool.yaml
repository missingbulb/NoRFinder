# The trick pool catalog: computer-vision methods to splice into a study's algorithm (the
# mutating-an-algorithm skill). `runnable` names the function in tricks.py where one exists; `invoke`
# lines use img (2-D float), stack (z, y, x), red/green (channels), u8 / f32 (dtype copies), r and
# sigma (sizes, in multiples of the object scale), mask (boolean).
- id: white-tophat
  name: White top-hat
  family: enhancement
  visual: 'Keeps bright things smaller than the footprint and flattens everything larger (background,
    big blobs, thick fibres) to zero.

    '
  how: 'Image minus its morphological opening with a structuring element of radius r. The opening removes
    every bright structure the disk cannot fit inside.

    '
  canonical_uses:
  - background removal in fluorescence
  - spot detection
  - retinal microaneurysms
  hook: pre
  scale: r ~ 1.5x object radius
  package: scikit-image
  invoke: skimage.morphology.white_tophat(img, footprint=skimage.morphology.disk(r))
  docs: https://scikit-image.org/docs/stable/api/skimage.morphology.html#skimage.morphology.white_tophat
  cost: light
  verified: true
  try_when: 'Uneven background makes a global threshold miss dim spots in dark regions, or a bright fibre
    bundle is mistaken for a spot.

    '
  runnable: white-tophat
- id: black-tophat
  name: Black top-hat
  family: enhancement
  visual: 'Turns small dark holes and gaps into bright marks on a black field; large dark areas vanish.

    '
  how: 'Morphological closing with a disk of radius r, minus the image. Highlights dark structures narrower
    than the disk, such as the unstained gap between two stained segments.

    '
  canonical_uses:
  - dark gap detection
  - dark vessel detection in bright-field
  - crack detection
  hook: map
  scale: r ~ gap half-width
  package: scikit-image
  invoke: skimage.morphology.black_tophat(img, footprint=skimage.morphology.disk(r))
  docs: https://scikit-image.org/docs/stable/api/skimage.morphology.html#skimage.morphology.black_tophat
  cost: light
  verified: true
  try_when: 'The target is defined by a dark gap between two bright parts (e.g. the node gap in the green
    channel between paranodes) and nothing scores that gap directly.

    '
- id: rolling-ball
  name: Rolling-ball background subtraction
  family: enhancement
  visual: 'Removes a smooth, slowly varying glow under the image while keeping small bright objects at
    their original height.

    '
  how: 'Rolls a ball of radius r under the intensity surface; the envelope it traces is the background,
    which is subtracted. Same idea as ImageJ''s Subtract Background.

    '
  canonical_uses:
  - fluorescence background removal
  - gel band analysis
  - ImageJ parity
  hook: pre
  scale: radius > largest object radius (typically 3-5x)
  package: scikit-image
  invoke: img - skimage.restoration.rolling_ball(img, radius=r)
  docs: https://scikit-image.org/docs/stable/api/skimage.restoration.html#skimage.restoration.rolling_ball
  cost: light
  verified: true
  try_when: 'A diffuse haze (out-of-focus light, autofluorescence) lifts some regions above threshold,
    producing false objects in bright patches and misses in dim ones.

    '
  runnable: rolling-ball
- id: percentile-background
  name: Percentile-filter background
  family: enhancement
  visual: 'Estimates a background from the darkish pixels in a neighbourhood and subtracts it, so dense
    clusters of objects do not inflate their own background.

    '
  how: 'A running low percentile (e.g. 10-30th) over a window much larger than objects estimates the local
    floor; subtract or divide. More robust than a mean when objects cover much of the window.

    '
  canonical_uses:
  - background in crowded fields
  - calcium imaging baseline
  - spectroscopy baseline
  hook: pre
  scale: size ~ 5-10x object diameter; percentile ~ 1 - object area fraction
  package: scipy
  invoke: img - scipy.ndimage.percentile_filter(img, percentile=20, size=r)
  docs: https://docs.scipy.org/doc/scipy/reference/generated/scipy.ndimage.percentile_filter.html
  cost: light
  verified: true
  try_when: 'Top-hat or rolling ball eats objects in dense clusters because the background estimate rises
    where objects crowd.

    '
- id: flat-field-division
  name: Flat-field division by a smoothed self-estimate
  family: enhancement
  visual: 'Brightens vignetted corners and dims an over-bright centre so the same object reads the same
    intensity anywhere in the field.

    '
  how: 'Divide the image by a heavy Gaussian (or median) blur of itself, normalised to mean 1. Multiplicative
    shading (illumination falloff) becomes flat, unlike subtractive methods.

    '
  canonical_uses:
  - vignetting correction
  - tile stitching
  - widefield shading
  hook: pre
  scale: sigma ~ 1/8 to 1/4 of field width
  package: scipy
  invoke: b = scipy.ndimage.gaussian_filter(img, sigma); img / (b / b.mean() + 1e-6)
  docs: https://docs.scipy.org/doc/scipy/reference/generated/scipy.ndimage.gaussian_filter.html
  cost: light
  verified: true
  try_when: 'Detection rate falls off toward image edges or corners; per-object intensity correlates with
    distance from the centre.

    '
- id: basic-flatfield
  name: BaSiC flat-field and dark-field estimation
  family: enhancement
  visual: 'Learns the shared shading pattern across many images or tiles and removes it from each.

    '
  how: 'Low-rank plus sparse decomposition of a stack of images recovers a common multiplicative flat
    field and additive dark field; each image is corrected by (I - D) / F.

    '
  canonical_uses:
  - whole-slide tile shading
  - time-lapse illumination drift
  - mosaic stitching
  hook: pre
  scale: none (needs many images from the same optics)
  package: basicpy
  invoke: basic = basicpy.BaSiC(get_darkfield=True); basic.fit(stack); basic.transform(stack)
  docs: https://basicpy.readthedocs.io/
  cost: heavy
  verified: false
  try_when: 'A set of images from one microscope all share the same brightness gradient and per-image
    smoothing cannot separate shading from real content.

    '
- id: n4-bias-field
  name: N4 bias-field correction
  family: enhancement
  visual: 'Removes a smooth multiplicative brightness drift across the image or volume, sharpening the
    intensity histogram.

    '
  how: 'Iteratively fits a B-spline log-bias field that maximises the sharpness of the intensity histogram
    (Tustison 2010). Developed for MRI, works on any multiplicative shading.

    '
  canonical_uses:
  - MRI inhomogeneity
  - z-attenuation in deep confocal stacks
  - lightsheet shading
  hook: pre
  scale: control-point spacing ~ field size / 4
  package: SimpleITK
  invoke: SimpleITK.N4BiasFieldCorrection(sitk_img, SimpleITK.OtsuThreshold(sitk_img, 0, 1))
  docs: https://simpleitk.org/doxygen/latest/html/classitk_1_1simple_1_1N4BiasFieldCorrectionImageFilter.html
  cost: medium
  verified: true
  try_when: 'Signal dims with depth in a z-stack, or slowly across a field, and the histogram looks smeared
    rather than bimodal.

    '
- id: homomorphic-filter
  name: Homomorphic filtering
  family: enhancement
  visual: 'Evens out illumination while boosting local detail, like a tone-mapped photograph.

    '
  how: 'Take log of the image, apply a high-emphasis frequency filter (attenuate low, boost high), exponentiate.
    Separates multiplicative illumination from reflectance in the log domain.

    '
  canonical_uses:
  - document scans
  - face illumination normalisation
  - X-ray
  hook: pre
  scale: cutoff_frequency_ratio ~ 1 / (illumination period in pixels)
  package: scikit-image
  invoke: 'np.expm1(skimage.filters.butterworth(np.log1p(img), cutoff_frequency_ratio=0.02, high_pass=True,
    order=2)) '
  docs: https://scikit-image.org/docs/stable/api/skimage.filters.html#skimage.filters.butterworth
  cost: light
  verified: true
  try_when: 'Shading is multiplicative so subtracting a background leaves bright regions still brighter
    in contrast.

    '
  runnable: homomorphic
- id: multiscale-retinex
  name: Multi-scale Retinex
  family: enhancement
  visual: 'Makes local contrast uniform: dim objects in shadowed areas pop up as strongly as bright ones,
    at the cost of halos near edges.

    '
  how: 'Sum over several scales of log(I) - log(Gaussian_s * I). Each term divides by a local surround
    estimate; averaging scales trades halo against dynamic-range compression.

    '
  canonical_uses:
  - low-light photography
  - medical image visibility
  - haze removal
  hook: pre
  scale: sigmas ~ {object size, 4x, 16x}
  package: scipy
  invoke: sum(np.log1p(img) - np.log1p(scipy.ndimage.gaussian_filter(img, s)) for s in (sigma, 4*sigma,
    16*sigma)) / 3
  docs: https://docs.scipy.org/doc/scipy/reference/generated/scipy.ndimage.gaussian_filter.html
  cost: light
  verified: true
  try_when: 'Dim objects sit beside a bright structure and get lost because their absolute intensity is
    lower than the bright region''s background.

    '
- id: local-contrast-normalisation
  name: Local contrast normalisation (local z-score)
  family: enhancement
  visual: 'Every neighbourhood is stretched to the same mean and spread, so faint and bright regions look
    equally textured.

    '
  how: '(I - local mean) / (local std + eps), both computed with a Gaussian or box window. Classic pre-processing
    in early CNNs and in adaptive thresholding.

    '
  canonical_uses:
  - CNN preprocessing
  - adaptive thresholding
  - texture analysis
  hook: pre
  scale: sigma ~ 3-5x object diameter
  package: scipy
  invoke: m = scipy.ndimage.gaussian_filter(img, sigma); s = np.sqrt(np.maximum(scipy.ndimage.gaussian_filter(img**2,
    sigma) - m**2, 0)); (img - m) / (s + 1e-6)
  docs: https://docs.scipy.org/doc/scipy/reference/generated/scipy.ndimage.gaussian_filter.html
  cost: light
  verified: true
  try_when: 'A single score threshold works in one image or region but not another because local contrast
    differs.

    '
  runnable: local-contrast-normalise
- id: clahe
  name: CLAHE (contrast-limited adaptive histogram equalisation)
  family: enhancement
  visual: 'Boosts contrast tile by tile so faint structures in dim areas become visible, without blowing
    up flat noise thanks to the clip limit.

    '
  how: 'Histogram equalisation in a grid of tiles with each histogram clipped at a limit, then bilinear
    blending between tiles.

    '
  canonical_uses:
  - retinal fundus vessels
  - X-ray
  - low-contrast microscopy
  hook: pre
  scale: kernel_size ~ 1/8 image width (or several object diameters)
  package: scikit-image
  invoke: skimage.exposure.equalize_adapthist(img, kernel_size=8*r, clip_limit=0.01)
  docs: https://scikit-image.org/docs/stable/api/skimage.exposure.html#skimage.exposure.equalize_adapthist
  cost: light
  verified: true
  try_when: 'Faint vessels or spots are visible to a person after contrast adjustment but the detector''s
    score map is dominated by a few bright regions.

    '
  runnable: clahe
- id: gamma-log-transform
  name: Gamma or log intensity compression
  family: enhancement
  visual: 'Lifts dim structures and compresses bright ones, so a faint object and a saturated one are
    closer in brightness.

    '
  how: 'Pointwise I^gamma (gamma<1) or log(1+gain*I). Changes nothing spatially but reshapes how a threshold
    or a scoring sum weighs dim versus bright pixels.

    '
  canonical_uses:
  - display
  - astronomy
  - dynamic-range compression before thresholding
  hook: pre
  scale: none
  package: scikit-image
  invoke: skimage.exposure.adjust_gamma(img, gamma=0.5)
  docs: https://scikit-image.org/docs/stable/api/skimage.exposure.html#skimage.exposure.adjust_gamma
  cost: light
  verified: true
  try_when: 'Very bright objects dominate a sum or a mean so dim true objects score below noise.

    '
- id: anscombe-vst
  name: Anscombe / generalised Anscombe variance-stabilising transform
  family: enhancement
  visual: 'No visible change to structure, but the noise becomes equally strong in bright and dark areas,
    so one denoiser strength fits everywhere.

    '
  how: '2*sqrt(I + 3/8) turns Poisson noise into roughly unit Gaussian noise; the generalised form adds
    a Gaussian read-noise term. Apply before a Gaussian-noise denoiser and invert after.

    '
  canonical_uses:
  - photon-limited imaging
  - astronomy
  - PET
  - BM3D on fluorescence
  hook: pre
  scale: needs counts in photon units (gain-corrected)
  package: numpy
  invoke: 2.0 * np.sqrt(np.maximum(img * gain, 0) + 3.0 / 8.0)
  docs: https://en.wikipedia.org/wiki/Anscombe_transform
  cost: light
  verified: true
  try_when: 'A denoiser oversmooths dim objects and undersmooths bright ones, because Poisson noise grows
    with intensity.

    '
  runnable: anscombe-gaussian
- id: percentile-normalisation
  name: Per-image percentile normalisation
  family: enhancement
  visual: 'Every image gets the same black point and white point, so thresholds mean the same thing across
    images with different exposure.

    '
  how: 'Map the p_low and p_high intensity percentiles (e.g. 1 and 99.8) to 0 and 1, clipping or not.
    The convention CSBDeep/StarDist use before inference.

    '
  canonical_uses:
  - deep-learning input normalisation
  - cross-image threshold transfer
  hook: pre
  scale: p_high ~ 1 - (object area fraction / 10)
  package: scikit-image
  invoke: skimage.exposure.rescale_intensity(img, in_range=tuple(np.percentile(img, (1, 99.8))), out_range=(0,
    1))
  docs: https://scikit-image.org/docs/stable/api/skimage.exposure.html#skimage.exposure.rescale_intensity
  cost: light
  verified: true
  try_when: 'A rule tuned on one image fails on another taken at a different gain or laser power.

    '
- id: histogram-matching
  name: Histogram matching to a reference image
  family: enhancement
  visual: 'Repaints an image''s intensity distribution to look like a chosen reference, preserving the
    ordering of pixel brightness.

    '
  how: 'Maps each grey level through the composition of the image''s CDF and the reference''s inverse
    CDF. Normalises acquisition differences across a dataset.

    '
  canonical_uses:
  - batch-effect removal
  - multi-site MRI
  - stain normalisation
  hook: pre
  scale: none
  package: scikit-image
  invoke: skimage.exposure.match_histograms(img, ref)
  docs: https://scikit-image.org/docs/stable/api/skimage.exposure.html#skimage.exposure.match_histograms
  cost: light
  verified: true
  try_when: 'One image (or one acquisition session) is consistently worse than the rest and its histogram
    shape differs from the good ones.

    '
- id: gaussian-denoise
  name: Gaussian smoothing (matched to object size)
  family: enhancement
  visual: 'Blurs speckle away; objects near the blur size become smooth bright blobs, finer detail is
    lost.

    '
  how: 'Convolution with an isotropic Gaussian of width sigma. With sigma ~ object radius / sqrt(2) it
    is the matched filter for a Gaussian-shaped spot in white noise.

    '
  canonical_uses:
  - denoising
  - matched filtering of spots
  - pre-smoothing before derivatives
  hook: pre
  scale: sigma ~ object radius / sqrt(2)
  package: scikit-image
  invoke: skimage.filters.gaussian(img, sigma=sigma)
  docs: https://scikit-image.org/docs/stable/api/skimage.filters.html#skimage.filters.gaussian
  cost: light
  verified: true
  try_when: 'Single noisy pixels cross the threshold and create many tiny false objects.

    '
- id: median-filter
  name: Median filter (2-D or 3-D)
  family: enhancement
  visual: 'Removes salt-and-pepper specks and hot pixels while keeping edges straighter than a blur.

    '
  how: 'Replaces each pixel by the median of its neighbourhood. Rejects impulsive outliers that a linear
    filter would smear into small blobs.

    '
  canonical_uses:
  - hot-pixel removal
  - impulse noise
  - speckle
  hook: pre
  scale: footprint radius ~ 1-2 px (below object radius)
  package: scikit-image
  invoke: skimage.filters.median(img, footprint=skimage.morphology.disk(1))
  docs: https://scikit-image.org/docs/stable/api/skimage.filters.html#skimage.filters.median
  cost: light
  verified: true
  try_when: 'Isolated single bright pixels (detector hot pixels, cosmic rays) are detected as spots.

    '
  runnable: median-denoise
- id: nl-means
  name: Non-local means denoising
  family: enhancement
  visual: 'Smooths noise strongly in flat areas while repeated structures (many similar spots or fibre
    segments) stay crisp, because they average with each other.

    '
  how: 'Each pixel becomes a weighted average of pixels whose surrounding patches look similar, searched
    within a window. Weight decays with patch distance relative to h.

    '
  canonical_uses:
  - photographic denoising
  - MRI
  - low-SNR microscopy
  hook: pre
  scale: patch_size ~ object diameter; h ~ 0.8 * noise sigma
  package: scikit-image
  invoke: skimage.restoration.denoise_nl_means(img, patch_size=5, patch_distance=6, h=0.8*skimage.restoration.estimate_sigma(img),
    fast_mode=True)
  docs: https://scikit-image.org/docs/stable/api/skimage.restoration.html#skimage.restoration.denoise_nl_means
  cost: light
  verified: true
  try_when: 'Low-SNR images where Gaussian smoothing merges neighbouring objects or erases dim thin ones.

    '
  runnable: non-local-means
- id: bm3d
  name: BM3D collaborative filtering
  family: enhancement
  visual: 'State-of-the-art classical denoising: noise disappears while small repeated textures and edges
    are kept, with little blur.

    '
  how: 'Groups similar patches into 3-D stacks, shrinks them jointly in a transform domain (hard threshold
    then Wiener), and aggregates. Expects Gaussian noise of known sigma.

    '
  canonical_uses:
  - image denoising benchmark baseline
  - fluorescence after Anscombe VST
  hook: pre
  scale: sigma_psd = noise std in image units
  package: bm3d
  invoke: bm3d.bm3d(img, sigma_psd=skimage.restoration.estimate_sigma(img))
  docs: https://pypi.org/project/bm3d/
  cost: medium
  verified: true
  try_when: 'NL-means still leaves grain that produces false weak objects, and the noise is roughly Gaussian
    (or made so by a VST).

    '
- id: tv-chambolle
  name: Total-variation denoising (Chambolle)
  family: enhancement
  visual: 'Turns the image into flat cartoon patches with sharp boundaries; noise and fine texture vanish,
    edges stay.

    '
  how: 'Minimises noise energy plus weight times the total variation (L1 of gradient). Favours piecewise-constant
    images, so small low-contrast details are flattened first.

    '
  canonical_uses:
  - denoising
  - staircase segmentation preprocessing
  - CT
  hook: pre
  scale: weight ~ noise sigma relative to signal range
  package: scikit-image
  invoke: skimage.restoration.denoise_tv_chambolle(img, weight=0.1)
  docs: https://scikit-image.org/docs/stable/api/skimage.restoration.html#skimage.restoration.denoise_tv_chambolle
  cost: light
  verified: true
  try_when: 'Object boundaries are ragged from noise and region-based measures (area, length) are biased
    by it.

    '
  runnable: tv-denoise
- id: bilateral-filter
  name: Bilateral filter
  family: enhancement
  visual: 'Smooths within regions of similar brightness but refuses to blur across a strong edge.

    '
  how: 'Weighted average with weights that fall off both with spatial distance (sigma_spatial) and with
    intensity difference (sigma_color).

    '
  canonical_uses:
  - edge-preserving smoothing
  - tone mapping
  - HDR
  hook: pre
  scale: sigma_spatial ~ object radius; sigma_color ~ 2x noise sigma
  package: scikit-image
  invoke: skimage.restoration.denoise_bilateral(img, sigma_color=0.1, sigma_spatial=sigma)
  docs: https://scikit-image.org/docs/stable/api/skimage.restoration.html#skimage.restoration.denoise_bilateral
  cost: light
  verified: true
  try_when: 'Smoothing that removes noise also blurs two adjacent objects into one.

    '
  runnable: bilateral
- id: guided-filter-cross-channel
  name: Guided filter (cross-channel guidance)
  family: enhancement
  visual: 'Smooths one channel using the edges of another: e.g. the red channel is denoised but keeps
    the boundaries that the green channel shows.

    '
  how: 'Locally fits the output as a linear function of the guide image in each window (He 2010), with
    eps regularising the slope. Linear-time and halo-free.

    '
  canonical_uses:
  - flash/no-flash
  - dehazing matte refinement
  - depth upsampling
  - multi-channel fusion
  hook: pre
  scale: radius ~ object radius; eps ~ (noise sigma)^2
  package: opencv-contrib-python
  invoke: cv2.ximgproc.guidedFilter(guide=green.astype(np.float32), src=red.astype(np.float32), radius=r,
    eps=1e-3)
  docs: https://docs.opencv.org/4.x/da/d17/group__ximgproc__filters.html
  cost: medium
  verified: true
  try_when: 'One channel is noisy but its objects co-locate with structure that a cleaner channel shows
    well (a red node spot sitting between green paranodes).

    '
- id: joint-bilateral
  name: Joint (cross) bilateral filter
  family: enhancement
  visual: 'Smooths one image while respecting the edges of a second image.

    '
  how: 'Bilateral filter whose range weights come from a joint image rather than the source.

    '
  canonical_uses:
  - flash/no-flash photography
  - depth map upsampling
  - channel-guided denoising
  hook: pre
  scale: d ~ object diameter; sigmaColor in joint-image units
  package: opencv-contrib-python
  invoke: cv2.ximgproc.jointBilateralFilter(green.astype(np.float32), red.astype(np.float32), d=2*r+1,
    sigmaColor=0.1, sigmaSpace=r)
  docs: https://docs.opencv.org/4.x/da/d17/group__ximgproc__filters.html
  cost: medium
  verified: true
  try_when: 'Same as the guided filter, when a non-linear edge test is preferred.

    '
- id: rolling-guidance
  name: Rolling guidance filter
  family: enhancement
  visual: 'Removes all structures smaller than a chosen scale entirely (not just blurs them) while restoring
    the sharp edges of the larger ones.

    '
  how: 'Gaussian blur to kill small structures, then iterated joint-bilateral filtering of the input guided
    by the previous result, which recovers large-scale edges (Zhang 2014).

    '
  canonical_uses:
  - scale-aware texture removal
  - detail separation
  hook: pre
  scale: sigmaSpace ~ size of structures to remove
  package: opencv-contrib-python
  invoke: cv2.ximgproc.rollingGuidanceFilter(f32, d=-1, sigmaColor=0.1, sigmaSpace=sigma, numOfIter=4)
  docs: https://docs.opencv.org/4.x/da/d17/group__ximgproc__filters.html
  cost: medium
  verified: true
  try_when: 'Small debris or speckle of a known size range keeps producing false objects next to larger
    true structures whose edges must stay sharp.

    '
- id: l0-smoothing
  name: L0 gradient minimisation
  family: enhancement
  visual: 'Flattens the image into a few uniform regions with crisp step edges, like a posterised cut-out;
    weak edges disappear entirely.

    '
  how: 'Minimises data fidelity plus lambda times the count of non-zero gradients (Xu 2011), solved by
    half-quadratic splitting. Unlike TV, it does not shrink strong edges.

    '
  canonical_uses:
  - edge extraction
  - clip-art restoration
  - detail enhancement
  hook: pre
  scale: lambda_ controls region count; scale-free in pixels
  package: opencv-contrib-python
  invoke: cv2.ximgproc.l0Smooth(f32, lambda_=0.01, kappa=2.0)
  docs: https://docs.opencv.org/4.x/da/d17/group__ximgproc__filters.html
  cost: medium
  verified: true
  try_when: 'Object outlines are fuzzy and a segmentation needs a few clean plateaus rather than a smooth
    gradient.

    '
- id: fast-global-smoother
  name: Fast global smoother (weighted least squares)
  family: enhancement
  visual: 'Very strong edge-aware smoothing across the whole image, with flat interiors and edges that
    follow the guide.

    '
  how: 'Approximates the weighted-least-squares smoother of Farbman 2008 with separable 1-D global solves
    (Min 2014). Lambda sets overall smoothness, sigma_color the edge sensitivity.

    '
  canonical_uses:
  - tone mapping
  - detail manipulation
  - depth filtering
  hook: pre
  scale: lambda_ ~ smoothness (dimensionless); sigma_color in intensity units of the 8-bit guide
  package: opencv-contrib-python
  invoke: cv2.ximgproc.fastGlobalSmootherFilter(u8, f32, lambda_=100.0, sigma_color=10.0)
  docs: https://docs.opencv.org/4.x/da/d17/group__ximgproc__filters.html
  cost: medium
  verified: true
  try_when: 'A background estimate must follow object boundaries rather than leak into them.

    '
- id: domain-transform
  name: Domain transform filter
  family: enhancement
  visual: 'Edge-preserving smoothing like a bilateral filter, much faster, slightly stronger along edges.

    '
  how: 'Maps the image to a 1-D domain where geodesic distances along edges are preserved and filters
    there with recursive or normalised convolution (Gastal & Oliveira 2011).

    '
  canonical_uses:
  - real-time edge-aware smoothing
  - stylisation
  - depth refinement
  hook: pre
  scale: sigmaSpatial ~ object radius; sigmaColor in intensity units
  package: opencv-contrib-python
  invoke: cv2.ximgproc.dtFilter(f32, f32, sigmaSpatial=sigma, sigmaColor=0.1)
  docs: https://docs.opencv.org/4.x/da/d17/group__ximgproc__filters.html
  cost: medium
  verified: true
  try_when: 'Bilateral filtering helps but is too slow to sweep parameters across a large stack.

    '
- id: weighted-median
  name: Weighted median filter (guided)
  family: enhancement
