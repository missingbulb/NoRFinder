    '
  canonical_uses:
  - object-based colocalization
  - synapse pre/post pairing
  - cell-cell contact analysis
  hook: verify
  scale: partner radius ~ expected paranode-to-node distance (from GT)
  package: scipy
  invoke: d, j = scipy.spatial.cKDTree(green_pts).query(red_pts, k=2, distance_upper_bound=R)
  docs: https://docs.scipy.org/doc/scipy/reference/generated/scipy.spatial.cKDTree.query.html
  cost: light
  verified: true
  try_when: 'False red-only blobs (debris, other stained structures) are kept; requiring flanking green
    objects rejects them. k=2 lets you require two partners.

    '
- id: triplet-collinearity-grouping
  name: Flanking-pair collinearity test (green-red-green triplet)
  family: grouping
  visual: 'Accepts a red dot only if two green objects sit on opposite sides of it, roughly on one line
    and at similar distances, the signature of a node between two paranodes.

    '
