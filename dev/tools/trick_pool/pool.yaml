    '
  canonical_uses:
  - small-noise removal
  - shape-preserving filtering
  - node-of-interest extraction
  hook: pre
  scale: area_threshold ~ smallest object area; diameter_threshold ~ object length
  package: scikit-image
  invoke: skimage.morphology.area_opening(img, area_threshold=a, connectivity=1); skimage.morphology.diameter_opening(img,
    diameter_threshold=d)
  docs: https://scikit-image.org/docs/stable/api/skimage.morphology.html#skimage.morphology.area_opening
  cost: light
  verified: true
  try_when: 'Tiny bright specks become false candidates, and a Gaussian or top-hat filter also erodes
    the true small objects; img - area_opening(img, a) isolates exactly the structures smaller than a.

    '
- id: cubical-persistence
  name: Persistent homology of the image (cubical complex)
  family: grouping
  visual: 'Ranks every bright blob by how long it survives as the threshold sweeps from high to low; real
    objects persist, noise bumps are born and die almost at once.

    '
  how: 'Sublevel/superlevel filtration of the pixel grid as a cubical complex; 0-dim persistence pairs
    (birth, death) give each peak''s prominence; 1-dim pairs give loops (vascular cycles, rings).

    '
  canonical_uses:
  - topological data analysis of images
  - peak significance
  - loop detection in networks
  hook: verify
  scale: none (intensity units; persistence threshold ~ k * noise)
  package: gudhi
  invoke: cc = gudhi.CubicalComplex(top_dimensional_cells=-img); pairs = cc.persistence()
  docs: https://gudhi.inria.fr/python/latest/cubical_complex_user.html
  cost: medium
  verified: true
  try_when: 'Need a threshold-free significance score per candidate peak; 1-dim persistence also flags
    spurious loops in a vessel mask (holes from two vessels touching).

    '
- id: ripser-point-persistence
  name: Vietoris-Rips persistence of point patterns
  family: grouping
  visual: 'Summarizes a cloud of detections by which clusters and rings exist at which length scales,
    e.g. evenly spaced nodes along a fibre versus random clutter.

    '
  how: 'Builds a Rips filtration over pairwise distances and computes H0/H1 persistence diagrams; compare
    diagrams between prediction and ground truth with bottleneck/Wasserstein distance (persim).

    '
  canonical_uses:
  - point-cloud shape
  - comparing spatial arrangements
  - cluster scale estimation
  hook: stats
  scale: none (distances in px or um)
  package: ripser
  invoke: dgms = ripser.ripser(points, maxdim=1)['dgms']
  docs: https://ripser.scikit-tda.org/en/latest/reference/stubs/ripser.ripser.html
  cost: light
  verified: true
  try_when: 'Counts match ground truth but the spatial arrangement does not (false detections clustered,
    true ones regularly spaced along axons); diagram distance exposes it.

    '
- id: ripley-k-l
  name: Ripley's K / L function
  family: grouping
  visual: 'A curve saying, at each radius r, whether detections are more clustered or more evenly spread
    than random; compare the prediction''s curve to the ground truth''s.

    '
  how: 'K(r) = area/n^2 * sum_{i!=j} 1[d_ij < r] (with edge correction); L(r) = sqrt(K/pi) - r is zero
    for complete spatial randomness.

    '
  canonical_uses:
  - spatial statistics of cells
  - clustering of puncta
  - ecology point patterns
  hook: stats
  scale: r from 0 to ~1/4 of the field width, in um
  package: pointpats
  invoke: 'pointpats.k(points, support=radii)   # or pointpats.l / pointpats.k_test for envelopes'
  docs: https://pysal.org/pointpats/api.html
  cost: light
  verified: false
  try_when: 'Aggregate stats look right but false positives come in clusters (noise patches, debris) or
