    '
  canonical_uses:
  - duplicate-detection diagnosis
  - spacing statistics
  - quality control
  hook: stats
  scale: none (distances in px; compare to object diameter)
  package: scipy
  invoke: d, _ = scipy.spatial.cKDTree(pts).query(pts, k=2); nn = d[:, 1]
  docs: https://docs.scipy.org/doc/scipy/reference/generated/scipy.spatial.cKDTree.query.html
  cost: light
  verified: true
  try_when: 'Predicted counts exceed GT and you suspect one object is detected twice (split dots, both
    paranodes firing); also a non-max-suppression radius can be set from the NN gap.

    '
- id: cross-type-nn-colocalization
  name: Cross-channel nearest-neighbour (bivariate point pattern)
  family: grouping
  visual: 'For each red detection, the distance to the nearest green detection (and vice versa); a red
    dot with no green partner within a node''s length is suspect.

    '
  how: 'Build a cKDTree on channel-B points and query channel-A points; compare the distribution to a
