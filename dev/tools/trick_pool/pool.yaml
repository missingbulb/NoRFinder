    '
  canonical_uses:
  - pairing problems
  - stereo correspondence
  - symmetric part grouping
  hook: candidates
  scale: pair distance bound ~ expected node gap + paranode length
  package: networkx
  invoke: G = networkx.Graph(); G.add_weighted_edges_from(edges); pairs = networkx.max_weight_matching(G,
