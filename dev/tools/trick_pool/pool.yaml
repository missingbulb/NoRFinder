  - separating touching vessels (artery vs vein)
  - splitting two adjacent organs
  hook: post
  scale: none (intensity tolerance only)
  package: SimpleITK
  invoke: sitk.IsolatedConnected(sitk.GetImageFromArray(img), seed1=[x1, y1], seed2=[x2, y2], lower=lo,
    upper=hi)
  docs: https://simpleitk.org/doxygen/latest/html/classitk_1_1simple_1_1IsolatedConnectedImageFilter.html
  cost: medium
  verified: true
  try_when: 'Two touching objects (two adjacent nodes, two parallel vessels) keep merging under any single
    threshold, and you have one seed for each.

    '
- id: marker-watershed-distance
  name: Marker-controlled watershed on the distance transform
  family: grouping
  visual: 'Splits a blob shaped like touching circles into its circles along the necks between them.

    '
  how: 'EDT of the binary mask; markers at local maxima of the EDT (peak_local_max with a min distance);
    watershed of -EDT restricted to the mask.

    '
  canonical_uses:
  - touching nuclei
  - overlapping cells
  - beads
  - grains
  hook: post
  scale: min_distance ~ object radius
  package: scikit-image
  invoke: d = ndi.distance_transform_edt(mask); pk = skimage.feature.peak_local_max(d, min_distance=r,
    labels=ndi.label(mask)[0]); mk = np.zeros_like(d, int); mk[tuple(pk.T)] = np.arange(1, len(pk)+1);
    lab = skimage.segmentation.watershed(-d, mk, mask=mask)
  docs: https://scikit-image.org/docs/stable/auto_examples/segmentation/plot_watershed.html
  cost: light
  verified: true
  try_when: 'Counts are too low because adjacent objects fuse into one component.

    '
- id: intensity-watershed-hmaxima
  name: Intensity watershed with h-maxima markers (dynamics)
  family: grouping
  visual: 'Every bright peak that stands at least h above the saddle to its brighter neighbour becomes
    a seed; minor bumps on one object do not split it, but two genuinely separate dots do split.

    '
  how: 'h_maxima(img, h) yields regional maxima of dynamic >= h; label them and run watershed on -img
    (optionally within a foreground mask). h is the minimum peak prominence.

    '
  canonical_uses:
  - splitting touching spots
  - nuclei by intensity
  - puncta counting
  hook: candidates
  scale: 'h in intensity units: set as k * noise sigma (scale-free in SNR)'
  package: scikit-image
  invoke: mk = skimage.measure.label(skimage.morphology.h_maxima(img, h)); lab = skimage.segmentation.watershed(-img,
    mk, mask=fg)
  docs: https://scikit-image.org/docs/stable/api/skimage.morphology.html#skimage.morphology.h_maxima
  cost: light
  verified: true
  try_when: 'peak_local_max either over-splits noisy objects (too many seeds) or merges close pairs (min_distance
    too big); prominence is the better-behaved knob.

    '
- id: compact-watershed
  name: Compact watershed
  family: grouping
  visual: 'A watershed whose basins are pulled toward round, Voronoi-like shapes, so a leaky gradient
    does not let one region snake far along a weak edge.

    '
  how: 'Priority-flood where each pixel''s priority is its value plus compactness * distance to its marker
    (Neubert & Protzel 2014). compactness=0 is classic watershed; large values give Voronoi.

    '
  canonical_uses:
  - regular superpixels
  - cell segmentation with leaky borders
  hook: post
  scale: compactness relative to (intensity range / object radius)
  package: scikit-image
  invoke: skimage.segmentation.watershed(grad, markers, compactness=c)
  docs: https://scikit-image.org/docs/stable/api/skimage.segmentation.html#skimage.segmentation.watershed
  cost: light
  verified: true
  try_when: 'Watershed regions leak through gaps in weak boundaries and some objects grab long thin tentacles
    of background.

    '
- id: stochastic-watershed
  name: Stochastic watershed
  family: grouping
  visual: 'Produces a boundary-probability map: edges that separate regions under many random seed placements
    are bright, accidental edges from noise are faint.

    '
  how: 'Runs many watersheds from random seeds on a gradient image and accumulates how often each pixel
    lies on a boundary (Angulo & Jeulin 2007); threshold or re-watershed the result.

    '
  canonical_uses:
  - unsupervised cell boundaries
  - grain boundaries
  - robust over-segmentation fix
  hook: map
  scale: nSeeds ~ expected number of regions (x a few)
  package: diplib
  invoke: dip.StochasticWatershed(dip.Gradient(img), nSeeds=n, nIterations=50, noise=0, seeds='hexagonal')
  docs: https://diplib.org/diplib-docs/segmentation.html#dip-StochasticWatershed-dip-Image-CL-dip-Image-L-dip-Random-L-dip-uint-dip-uint-dip-dfloat-dip-String-CL
  cost: medium
  verified: true
  try_when: 'Classic watershed over-segments on noise and the right split boundaries cannot be told apart
    from noise edges by gradient strength alone.

    '
- id: sitk-morphological-watershed-level
  name: Level-flooded morphological watershed (ITK)
  family: grouping
  visual: 'Watershed without markers, where basins shallower than `level` are merged first: a single knob
    between ''every speckle its own region'' and ''only deep valleys split''.

    '
  how: 'Flood a gradient image after suppressing minima of depth < level (an h-minima transform), then
